<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Server error · SkillSwap</title>
  <style>
    /* Self-contained on purpose: a 500 may mean the database or templates are
       unavailable, so this page depends on nothing external. */
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef5fb; color: #0e2a3f; padding: 2rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b1722; color: #e6f1fa; }
    }
    .card { max-width: 34rem; text-align: center; }
    .code { font-size: 3rem; font-weight: 800; margin: 0; color: #1a8fe3; }
    h1 { font-size: 1.5rem; margin: .5rem 0 1rem; }
    p { line-height: 1.6; margin: 0 0 1.5rem; }
    a.btn {
      display: inline-block; text-decoration: none; font-weight: 700;
      background: #1a8fe3; color: #fff; padding: .6rem 1.2rem; border-radius: 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">500</p>
    <h1>Something went wrong on our end</h1>
    <p>We hit an unexpected error. The team has been notified — please try again in a little while.</p>
    <a class="btn" href="/">Back to home</a>
  </main>
</body>
</html>
